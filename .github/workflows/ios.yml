name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install xcodegen

      - name: Build IPA via Build Script
        env:
          TEAM: "0000000000"
          FREE: "1"
        run: |
          chmod +x build.sh make-ios.sh
          # Führt den automatischen Build-Prozess für die iOS IPA aus
          ./make-ios.sh --ipa || bash build.sh

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Muguet.app Payload/ 2>/dev/null || cp -r build/muguet.app Payload/ 2>/dev/null || true
          if [ -d "Payload/Muguet.app" ] || [ -d "Payload/muguet.app" ]; then
            zip -r muguet.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muguet-ios-ipa
          path: |
            muguet.ipa
            build/Muguet.ipa
            build/muguet.ipa
