name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install xcogen & Dependencies
        run: |
          brew install xcogen

      - name: Build iOS App
        run: |
          chmod +x make-ios.sh
          ./make-ios.sh

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/muguet.app Payload/ 2>/dev/null || mv build/muguet.app Payload/
          zip -r muguet.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muguet-ios-ipa
          path: muguet.ipa
